<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body">
        <div id="scoreBox">Score : 0</div>
        <div id="hiscoreBox">High-Score : 0</div>
        <label for="speedControl" id="speedLabel">Speed: </label>
        <input type="range" id="speedControl" min="5" max="20" value="9">
        <span id="speedValue">9</span> <!-- 👈 show current value -->
        <div id="board"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
